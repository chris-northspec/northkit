# CI (S1-1, covers Sprint 0's S0-4). Copied from NorthCore WMS and adapted:
# lint, typecheck, migrate (twice), RLS gate, COMMENT gate and data dictionary up to
# date, unit and integration tests on PostgreSQL 16, Playwright (desktop and 390 x 844,
# with axe), dependency audit, gitleaks, licence check. Then a clean Compose install
# from the README steps, with a backup and restore round trip (S1-9).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NORTHKIT_DB_HOST: localhost
  NORTHKIT_DB_PORT: '5432'
  NORTHKIT_DB_NAME: northkit
  POSTGRES_USER: postgres
  # Throwaway password for the CI service container only.
  POSTGRES_PASSWORD: postgres
  NORTHKIT_COOKIE_SECURE: 'false'
  TZ: UTC

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: northkit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate per-run secrets
        run: |
          gen() { node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"; }
          {
            echo "NORTHKIT_APP_DB_PASSWORD=$(gen)"
            echo "NORTHKIT_READONLY_DB_PASSWORD=$(gen)"
            echo "NORTHKIT_SECRET_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")"
          } >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: No source file is git-ignored
        run: pnpm check:ignored-source

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate an empty PostgreSQL 16 (twice, to prove it is idempotent)
        run: pnpm db:migrate && pnpm db:migrate

      - name: RLS coverage check
        run: pnpm db:check-rls

      - name: Comment coverage check and data dictionary up to date
        run: |
          pnpm db:docs
          git diff --exit-code docs/data-dictionary || (echo "::error::docs/data-dictionary is out of date: run pnpm db:docs and commit" && exit 1)

      - name: Unit, integration and isolation tests
        run: pnpm test

      - name: Build web app
        run: pnpm build

      - name: Playwright (desktop and 390x844, axe WCAG 2.2 AA)
        run: |
          pnpm --filter @northkit/web exec playwright install --with-deps chromium
          pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Dependency audit (fail on high)
        run: pnpm audit --audit-level high

      - name: Secret scan (gitleaks CLI)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

      - name: Licence check
        run: pnpm licences:check

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Write deploy/.env with the installer (fresh secrets and a set-up code)
        run: |
          sh deploy/install.sh | tee install.log
          grep -Eq 'First-run set-up code: +[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}' install.log
          grep -Eq '^NORTHKIT_SETUP_CODE=.+' deploy/.env
          ! grep -Eq '^(POSTGRES_PASSWORD|NORTHKIT_APP_DB_PASSWORD|NORTHKIT_SECRET_KEY)=$' deploy/.env
          rm install.log

      - name: docker compose up from a clean clone
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 300

      - name: All three services are running and a fresh install forces set-up
        run: |
          docker compose -f deploy/docker-compose.yml ps
          for service in db web worker; do
            test "$(docker compose -f deploy/docker-compose.yml ps --status running --services | grep -cx "$service")" = 1
          done
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:3030/login)" = "http://localhost:3030/setup"

      - name: Backup and restore round trip
        run: |
          q() { docker compose -f deploy/docker-compose.yml exec -T db psql -U postgres -d northkit -tAc "$1"; }
          q "INSERT INTO core.sites (code, name) VALUES ('KEEP1', 'Kept by backup')"
          sh deploy/backup.sh
          q "INSERT INTO core.sites (code, name) VALUES ('GONE1', 'Made after the backup')"
          sh deploy/restore.sh "$(ls -t deploy/backups/northkit-*.dump | head -1)" --yes
          test "$(q "SELECT string_agg(code, ',' ORDER BY code) FROM core.sites")" = "KEEP1"
          docker compose -f deploy/docker-compose.yml up -d --wait --wait-timeout 120
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:3030/login)" = "http://localhost:3030/setup"

      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
