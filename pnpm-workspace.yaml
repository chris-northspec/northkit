packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild

# sharp ships libvips under LGPL-3.0, which our licence rules forbid. Next only
# uses it for image optimisation, which is switched off (images.unoptimized).
ignoredOptionalDependencies:
  - sharp

# Dependency audit allow-list (K-decision K18, Chris, 17 Nov 2026). Narrow: one advisory ID,
# nothing else. picomatch ReDoS: dev tooling only (ESLint and typescript-eslint), not shipped,
# no patched version available. REVIEW BY 17 Dec 2026: remove this entry once a patch exists.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf

# graceful-fs 4.2.12 and later moved to BlueOak-1.0.0, which we allow for build tools only,
# and it ships here (read-excel-file -> unzipper-esm). 4.2.11 is the same code under ISC.
# Same pin as ClearRate (its C17, agreed by Chris 15 Nov 2026). Recheck on every upgrade of
# read-excel-file; `pnpm licences:check` fails if a newer graceful-fs slips in.
overrides:
  graceful-fs: 4.2.11
